server:
  port: ${PORT:8080}

spring:
  application:
    name: agsfjope
  
  # Database Configuration (PostgreSQL 15+)
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15         # Đủ cho grading + API requests đồng thời
      minimum-idle: 1               # Chỉ giữ 1 idle — tránh chiếm quá nhiều connection khi startup
      connection-timeout: 60000     # Chờ tối đa 60s để lấy connection từ pool
      max-lifetime: 1500000         # 25 phút — đóng connection cũ trước khi PostgreSQL idle timeout
      idle-timeout: 300000          # 5 phút — thu hồi connection idle
      keepalive-time: 60000         # Ping 60s/lần để detect stale connection sớm
      initialization-fail-timeout: -1  # Không fail khi startup nếu DB tạm thời đầy connection
      pool-name: OopExamPool



  # Jackson JSON serialization — múi giờ Việt Nam
  jackson:
    time-zone: Asia/Ho_Chi_Minh

  # JPA / Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: validate # Hibernate validates entities match DB — Flyway manages schema
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
        order_inserts: true

  # Flyway Database Migrations
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true     # Cho phep baseline DB da co san (Supabase)
    baseline-version: 1           # Danh dau V1 da duoc apply (DB hien tai = V1)
    out-of-order: true            # Cho phep apply migration chua theo thu tu version
    validate-on-migrate: true     # Kiem tra migration chua bi chinh sua

  # Mail / SMTP Configuration (Gmail)
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          # Fix lỗi bị Gmail chặn nếu server delay
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# Custom Application Properties
'[app]':
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-expiration-ms: 3600000 # 1 giờ
      refresh-token-expiration-ms: 86400000 # 1 ngày
  encryption:
    secret-key: ${APP_ENCRYPTION_SECRET_KEY:change-this-secret-key-in-production}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS}

# MinIO Object Storage (S3-compatible)
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin123}
  bucket:
    exam-papers: exam-papers
    submissions: submissions

# OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# Grading Sandbox Configuration
# Point java-executable to a JDK that supports the class file version students used (Java 21 = class 65).
# On Windows: e.g. C:/Program Files/Java/jdk-21/bin/java.exe
sandbox:
  java-executable: ${SANDBOX_JAVA:java}